name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: test_e2e/package-lock.json

      - name: Install dependencies
        working-directory: test_e2e
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: test_e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: test_e2e
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SELLER_EMAIL: ${{ secrets.SELLER_EMAIL }}
          SELLER_PASSWORD: ${{ secrets.SELLER_PASSWORD }}
          API_URL: ${{ secrets.API_URL }}
          CI: true
        run: npm run test

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        if: always()
        run: |
          mkdir -p test_e2e/allure-results/history
          
          if [ -d "gh-pages/history" ]; then
            cp -R gh-pages/history/* test_e2e/allure-results/history/
          fi
          
          npx -y allure-commandline generate test_e2e/allure-results -o allure-history --clean

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always() && github.event_name == 'push'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages

      - name: Upload Playwright Failure Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test_e2e/test-results/
          retention-days: 14