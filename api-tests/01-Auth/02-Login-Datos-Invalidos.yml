info:
  name: 02-Login-Datos-Invalidos
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/login"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "usuario.inexistente@test.com",
        "password": "PasswordIncorrecta123"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe responder 401 Unauthorized", function () {
            expect(res.status).to.equal(401);
        });

        test("Debe retornar un mensaje de error", function () {
            expect(res.body).to.have.property("message");
        });

        test("Debe indicar que las credenciales son incorrectas", function () {
            expect(res.body.message).to.equal(
                "Las credenciales proporcionadas son incorrectas."
            );
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
      description: El login con credenciales inválidas debe ser rechazado con código 401
    - expression: res.body
      operator: isJson
      description: El body de la respuesta debe ser un JSON válido
    - expression: res.body.message
      operator: eq
      value: Las credenciales proporcionadas son incorrectas.
      description: El mensaje debe indicar que las credenciales proporcionadas son incorrectas

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
