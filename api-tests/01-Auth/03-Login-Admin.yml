info:
  name: 03-Login-Admin
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/login"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "tae@testing.com",
        "password": "Tae@2026"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body?.access_token) {
          bru.setEnvVar("token", res.body.access_token);

          console.log("Token guardado correctamente");
        }
    - type: tests
      code: |-
        test("Debe responder 200 OK", function () {
            expect(res.status).to.equal(200);
        });

        test("Debe retornar un access_token", function () {
            expect(res.body).to.have.property("access_token");
        });

        test("Debe retornar token_type Bearer", function () {
            expect(res.body.token_type).to.equal("Bearer");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
      description: La autenticación debe responder exitosamente
    - expression: res.body
      operator: isJson
      description: El body debe ser un JSON válido
    - expression: res.body.access_token
      operator: isString
      description: El token de acceso debe ser un string

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
