      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Cliente API Bruno Actualizado",
        "cuit": "20-12345678-6",
        "email": "",
        "phone": "",
        "whatsapp": "",
        "cbu": null,
        "collection_contact": "",
        "collection_email": "",
        "collection_phone": "",
        "collection_portal_password": "",
        "collection_portal_url": "",
        "collection_portal_username": "",
        "estado": "Activo",
        "serie": "",
        "startdate": "2026-09-02",
        "tax": "",
        "taxes": [],
        "zone": null,
        "zone_name": null
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
