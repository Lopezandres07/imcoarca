info:
  name: Get Lista Clientes
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/clients?sort_direction=asc"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Accept
      value: application/json
  params:
    - name: sort_direction
      value: asc
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
