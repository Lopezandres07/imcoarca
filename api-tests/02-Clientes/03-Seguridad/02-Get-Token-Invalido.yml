info:
  name: 02-Get-Token-Invalido
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/clients?sort_direction=asc"
  headers:
    - name: Authorization
      value: Bearer token_invalido_12345
    - name: Accept
      value: application/json
  params:
    - name: sort_direction
      value: asc
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe responder 401 Unauthorized", function () {
            expect(res.status).to.equal(401);
        });

        test("Debe retornar un mensaje de error", function () {
            expect(res.body).to.have.property("message");
        });

        test("Debe indicar que el usuario no está autenticado", function () {
            expect(res.body.message).to.equal("No autenticado.");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
      description: La consulta con un token inválido debe ser rechazada con código 401
    - expression: res.body
      operator: isJson
      description: El body de la respuesta debe ser un JSON válido
    - expression: res.body.message
      operator: eq
      value: No autenticado.
      description: El mensaje debe indicar que el token no permite autenticar al usuario

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
