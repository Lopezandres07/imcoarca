info:
  name: 01-Get-Lista-Clientes
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/clients?sort_direction=asc"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Accept
      value: application/json
  params:
    - name: sort_direction
      value: asc
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.body.data
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
