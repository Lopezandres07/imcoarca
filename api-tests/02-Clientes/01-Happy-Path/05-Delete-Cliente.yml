info:
  name: 05-Delete-Cliente
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/api/clients/{{clienteId}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
