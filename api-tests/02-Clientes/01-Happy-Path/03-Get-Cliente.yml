info:
  name: 03-Get-Cliente
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/clients/{{clienteId}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  assertions:
    - expression: res.body.data.id
      operator: eq
      value: "{{clienteId}}"
    - expression: res.body.data.name
      operator: eq
      value: Cliente API Bruno Prueba

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
