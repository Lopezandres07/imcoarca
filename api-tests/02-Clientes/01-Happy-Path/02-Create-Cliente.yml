info:
  name: 02-Create-Cliente
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/clients"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Cliente API Bruno Prueba",
        "cuit": "20-12345678-6",
        "email": "",
        "phone": "",
        "whatsapp": "",
        "cbu": null,
        "collection_contact": "",
        "collection_email": "",
        "collection_phone": "",
        "collection_portal_password": "",
        "collection_portal_url": "",
        "collection_portal_username": "",
        "estado": "Activo",
        "serie": "",
        "startdate": "2026-09-02",
        "tax": "",
        "taxes": [],
        "zone": null,
        "zone_name": null
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body?.data?.id) {
          bru.setEnvVar("clienteId", res.body.data.id);

          console.log("clienteId guardado correctamente");
        }
  assertions:
    - expression: res.body.data.name
      operator: eq
      value: Cliente API Bruno Prueba
    - expression: res.body.data.cuit
      operator: eq
      value: 20-12345678-6

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
