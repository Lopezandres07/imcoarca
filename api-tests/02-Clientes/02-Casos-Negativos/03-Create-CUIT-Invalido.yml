info:
  name: 03-Create-CUIT-Invalido
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/clients"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Cliente API CUIT Invalido",
        "cuit": "ABC123",
        "email": "",
        "phone": "",
        "whatsapp": "",
        "cbu": null,
        "collection_contact": "",
        "collection_email": "",
        "collection_phone": "",
        "collection_portal_password": "",
        "collection_portal_url": "",
        "collection_portal_username": "",
        "estado": "Activo",
        "serie": "",
        "startdate": "2026-09-02",
        "tax": "",
        "taxes": [],
        "zone": null,
        "zone_name": null
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe retornar un error de validación", function () {
            expect(res.body).to.have.property("errors");
        });

        test("Debe informar error de validación en cuit", function () {
            expect(res.body.errors).to.have.property("cuit");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
      description: La creación con un CUIT inválido debe ser rechazada con código 422
    - expression: res.body
      operator: eq
      value: isJson
      description: El body de la respuesta debe ser un JSON válido

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
