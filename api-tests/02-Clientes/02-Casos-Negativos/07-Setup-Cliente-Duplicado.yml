info:
  name: 07-Setup-Cliente-Duplicado
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/clients"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Cliente Duplicado Bruno",
        "cuit": "20-87654321-0",
        "startdate": "2026-09-13",
        "status": "Activo"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body?.data?.id) {
          bru.setEnvVar("clienteDuplicadoId", res.body.data.id);

          console.log(
            "Cliente base para duplicado creado con ID:",
            res.body.data.id
          );
        }
    - type: tests
      code: |-
        test("Debe responder 201 Created", function () {
          expect(res.status).to.equal(201);
        });

        test("Debe retornar los datos del cliente creado", function () {
          expect(res.body).to.have.property("data");
        });

        test("Debe retornar un id", function () {
          expect(res.body.data).to.have.property("id");
        });

        test("Debe crear el cliente con el nombre esperado", function () {
          expect(res.body.data.name).to.equal("Cliente Duplicado Bruno");
        });

        test("Debe crear el cliente con el CUIT esperado", function () {
          expect(res.body.data.cuit).to.equal("20-87654321-0");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
      description: El cliente base para la prueba de duplicidad debe crearse correctamente
    - expression: res.body
      operator: isJson
      description: El body de la respuesta debe ser un JSON válido
    - expression: res.body.data.id
      operator: isNumber
      description: La respuesta debe incluir el ID del cliente creado
    - expression: res.body.data.name
      operator: eq
      value: Cliente Duplicado Bruno
      description: El cliente base debe crearse con el nombre esperado
    - expression: res.body.data.cuit
      operator: eq
      value: 20-87654321-0
      description: El cliente base debe crearse con el CUIT esperado

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
