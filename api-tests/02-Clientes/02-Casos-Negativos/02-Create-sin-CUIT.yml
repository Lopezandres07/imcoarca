info:
  name: 02-Create-sin-CUIT
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/clients"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Cliente API Sin CUIT",
        "cuit": "",
        "email": "",
        "phone": "",
        "whatsapp": "",
        "cbu": null,
        "collection_contact": "",
        "collection_email": "",
        "collection_phone": "",
        "collection_portal_password": "",
        "collection_portal_url": "",
        "collection_portal_username": "",
        "estado": "Activo",
        "serie": "",
        "startdate": "2026-09-02",
        "tax": "",
        "taxes": [],
        "zone": null,
        "zone_name": null
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe responder 422 Unprocessable Entity", function () {
            expect(res.status).to.equal(422);
        });

        test("Debe informar error de validación en cuit", function () {
            expect(res.body.errors).to.have.property("cuit");
        });

        test("Debe indicar que cuit es obligatorio", function () {
            expect(res.body.errors.cuit[0]).to.equal("The cuit field is required.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
