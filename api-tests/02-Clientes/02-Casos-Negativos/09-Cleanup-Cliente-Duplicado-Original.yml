info:
  name: 09-Cleanup-Cliente-Duplicado-Original
  type: http
  seq: 9

http:
  method: DELETE
  url: "{{baseUrl}}/clients/{{clienteDuplicadoId}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe eliminar el cliente base de la prueba de duplicidad", function () {
          expect(res.status).to.equal(204);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
      description: El cliente base utilizado en la prueba de duplicidad debe eliminarse correctamente

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
