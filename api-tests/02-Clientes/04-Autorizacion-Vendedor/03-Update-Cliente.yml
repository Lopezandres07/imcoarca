info:
  name: 03-Update-Cliente
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/clients/{{sellerClienteId}}"
  headers:
    - name: Authorization
      value: Bearer {{sellerToken}}
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Cliente Vendedor Bruno Actualizado",
        "cuit": "20-12345678-6",
        "email": "",
        "phone": "",
        "whatsapp": "",
        "cbu": null,
        "collection_contact": "",
        "collection_email": "",
        "collection_phone": "",
        "collection_portal_password": "",
        "collection_portal_url": "",
        "collection_portal_username": "",
        "estado": "Activo",
        "serie": "",
        "startdate": "2026-09-10",
        "tax": "",
        "taxes": [],
        "zone": null,
        "zone_name": null
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe responder 200 OK", function () {
            expect(res.status).to.equal(200);
        });

        test("Debe retornar el cliente actualizado", function () {
            expect(res.body).to.have.property("data");
        });

        test("Debe mantener el identificador del cliente", function () {
            expect(res.body.data.id).to.equal(
                Number(bru.getEnvVar("sellerClienteId"))
            );
        });

        test("Debe actualizar el nombre del cliente", function () {
            expect(res.body.data.name).to.equal(
                "Cliente Vendedor Bruno Actualizado"
            );
        });

        test("Debe mantener el CUIT del cliente", function () {
            expect(res.body.data.cuit).to.equal("20-12345678-6");
        });
  assertions:
    - expression: res.body.data.name
      operator: eq
      value: Cliente Vendedor Bruno Actualizado

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
