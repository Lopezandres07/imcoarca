info:
  name: 02-Create-Cliente
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/clients"
  headers:
    - name: Authorization
      value: Bearer {{sellerToken}}
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Cliente Vendedor Bruno",
        "cuit": "20-12345678-6",
        "email": "",
        "phone": "",
        "whatsapp": "",
        "cbu": null,
        "collection_contact": "",
        "collection_email": "",
        "collection_phone": "",
        "collection_portal_password": "",
        "collection_portal_url": "",
        "collection_portal_username": "",
        "estado": "Activo",
        "serie": "",
        "startdate": "2026-09-10",
        "tax": "",
        "taxes": [],
        "zone": null,
        "zone_name": null
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body?.data?.id) {
            bru.setEnvVar("sellerClienteId", res.body.data.id);
            console.log("sellerClienteId guardado correctamente");
        }
    - type: tests
      code: |-
        test("Debe responder 201 Created", function () {
            expect(res.status).to.equal(201);
        });

        test("Debe retornar el cliente creado", function () {
            expect(res.body).to.have.property("data");
        });

        test("Debe retornar un id de cliente", function () {
            expect(res.body.data).to.have.property("id");
        });

        test("Debe crear el cliente con el nombre enviado", function () {
            expect(res.body.data.name).to.equal("Cliente Vendedor Bruno");
        });

        test("Debe crear el cliente con el CUIT enviado", function () {
            expect(res.body.data.cuit).to.equal("20-12345678-6");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
      description: La creación de cliente con usuario Vendedor debe responder exitosamente con código 201
    - expression: res.body
      operator: isJson
      description: El body de la respuesta debe ser un JSON válido
    - expression: res.body.data.id
      operator: isNumber
      description: El cliente creado debe retornar un identificador numérico
    - expression: res.body.data.name
      operator: eq
      value: Cliente Vendedor Bruno
    - expression: res.body.data.cuit
      operator: eq
      value: 20-12345678-6

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
