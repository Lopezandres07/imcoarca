info:
  name: 01-Get-Clientes
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/clients?sort_direction=asc"
  headers:
    - name: Authorization
      value: Bearer {{sellerToken}}
    - name: Accept
      value: application/json
  params:
    - name: sort_direction
      value: asc
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe responder 200 OK", function () {
            expect(res.status).to.equal(200);
        });

        test("Debe retornar la propiedad data", function () {
            expect(res.body).to.have.property("data");
        });

        test("Debe retornar data como un array", function () {
            expect(res.body.data).to.be.an("array");
        });

        test("Debe retornar información de paginación", function () {
            expect(res.body).to.have.property("meta");
            expect(res.body.meta).to.have.property("current_page");
            expect(res.body.meta).to.have.property("total");
        });
  assertions:
    - expression: res.body.data
      operator: isArray
    - expression: res.body.meta
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
