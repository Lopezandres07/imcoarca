info:
  name: 01-Get-Clientes
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/clients?sort_direction=asc"
  headers:
    - name: Authorization
      value: Bearer {{sellerToken}}
    - name: Accept
      value: application/json
  params:
    - name: sort_direction
      value: asc
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe responder 200 OK", function () {
            expect(res.status).to.equal(200);
        });

        test("Debe retornar la propiedad data", function () {
            expect(res.body).to.have.property("data");
        });

        test("Debe retornar data como un array", function () {
            expect(res.body.data).to.be.an("array");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
      description: La consulta de clientes con usuario Vendedor debe responder exitosamente
    - expression: res.body
      operator: isJson
      description: El body de la respuesta debe ser un JSON válido
    - expression: res.body.data
      operator: isArray
      description: La lista de clientes debe retornar la propiedad data como un array

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
