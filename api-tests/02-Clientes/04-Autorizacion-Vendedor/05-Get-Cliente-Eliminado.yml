info:
  name: 05-Get-Cliente-Eliminado
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/clients/19722"
  headers:
    - name: Authorization
      value: Bearer {{sellerToken}}
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe responder 404 Not Found", function () {
            expect(res.status).to.equal(404);
        });

        test("Debe retornar un mensaje de error", function () {
            expect(res.body).to.have.property("message");
        });

        test("Debe indicar que el cliente no existe", function () {
            expect(res.body.message).to.include(
                "No query results for model"
            );
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
